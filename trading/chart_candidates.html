const DEFAULT='BHEL';
function renderSummary(d){
  const c=d.pnl>=0?'#2ecc71':'#e74c3c';
  document.getElementById('summary').innerHTML=`
    <div class="stat">Price <b>Rs${d.price_range[0]}–Rs${d.price_range[1]}</b></div>
    <div class="stat">Flips <b>${d.flips}</b></div>
    <div class="stat">Trades <b>${d.trades}</b></div>
    <div class="stat">Wins <b>${d.wins}/${d.trades}</b></div>
    <div class="stat">P&L <b style="color:${c}">${d.pnl>=0?'+':''}Rs${d.pnl.toFixed(2)}</b></div>`;}
function buildTraces(d){
  const sUx=[],sUy=[],sDx=[],sDy=[];
  d.trends.forEach((t,i)=>{
    if(t===1){sUx.push(d.times[i]);sUy.push(d.st[i]);sDx.push(d.times[i]);sDy.push(null);}
    else if(t===-1){sDx.push(d.times[i]);sDy.push(d.st[i]);sUx.push(d.times[i]);sUy.push(null);}
    else{sUx.push(d.times[i]);sUy.push(null);sDx.push(d.times[i]);sDy.push(null);}
  });
  return [
    {type:'candlestick',name:'Price',x:d.times,open:d.opens,high:d.highs,low:d.lows,close:d.closes,
     increasing:{line:{color:'#26a641'},fillcolor:'#26a641'},
     decreasing:{line:{color:'#e74c3c'},fillcolor:'#e74c3c'},xaxis:'x',yaxis:'y',whiskerwidth:0.4},
    {type:'scatter',name:'ST Bull',x:sUx,y:sUy,mode:'lines',line:{color:'#2ecc71',width:2},connectgaps:false,xaxis:'x',yaxis:'y'},
    {type:'scatter',name:'ST Bear',x:sDx,y:sDy,mode:'lines',line:{color:'#e74c3c',width:2},connectgaps:false,xaxis:'x',yaxis:'y'},
    {type:'scatter',name:'BUY',x:d.entries.map(e=>e.ts),y:d.entries.map(e=>e.price),mode:'markers',
     marker:{symbol:'triangle-up',size:16,color:'#00ff88',line:{color:'#0d1117',width:1}},
     text:d.entries.map(e=>`BUY Rs${e.price.toFixed(2)} qty=${e.qty}`),
     hovertemplate:'%{text}<extra></extra>',xaxis:'x',yaxis:'y'},
    {type:'scatter',name:'EXIT',x:d.exits.map(e=>e.ts),y:d.exits.map(e=>e.price),mode:'markers',
     marker:{symbol:'triangle-down',size:16,
       color:d.exits.map(e=>e.open?'#f39c12':(e.pnl>=0?'#2ecc71':'#ff4444')),
       line:{color:'#0d1117',width:1}},
     text:d.exits.map(e=>`EXIT Rs${e.price.toFixed(2)} P&L ${e.pnl>=0?'+':''}Rs${e.pnl.toFixed(2)}${e.open?' (OPEN)':''}`),
     hovertemplate:'%{text}<extra></extra>',xaxis:'x',yaxis:'y'},
    {type:'scatter',name:'Trend',x:d.times,y:d.trends,mode:'lines',
     line:{color:'#f7b731',width:2,shape:'hv'},fill:'tozeroy',
     fillcolor:'rgba(247,183,49,0.08)',xaxis:'x',yaxis:'y2'}
  ];}
function buildLayout(d){
  const shapes=[];
  d.entries.forEach(e=>shapes.push({type:'line',x0:e.ts,x1:e.ts,y0:0,y1:1,yref:'paper',line:{color:'rgba(0,255,136,0.25)',width:1,dash:'dot'}}));
  d.exits.forEach(e=>shapes.push({type:'line',x0:e.ts,x1:e.ts,y0:0,y1:1,yref:'paper',line:{color:'rgba(255,68,68,0.25)',width:1,dash:'dot'}}));
  const days=[...new Set(d.times.map(t=>t.slice(0,10)))];
  days.slice(1).forEach(day=>{const ts=d.times.find(t=>t.startsWith(day));
    if(ts)shapes.push({type:'line',x0:ts,x1:ts,y0:0,y1:1,yref:'paper',line:{color:'rgba(88,166,255,0.15)',width:1}});});
  return {
    paper_bgcolor:'#0d1117',plot_bgcolor:'#161b22',
    font:{color:'#e6edf3',family:'monospace',size:11},
    grid:{rows:2,columns:1,pattern:'independent',roworder:'top to bottom'},
    xaxis:{type:'category',rangeslider:{visible:false},showgrid:true,gridcolor:'#21262d',
      tickangle:-55,nticks:20,domain:[0,1],anchor:'y',showspikes:true,spikecolor:'#555',spikethickness:1},
    yaxis:{title:'Price (Rs)',showgrid:true,gridcolor:'#21262d',domain:[0.30,1],anchor:'x'},
    yaxis2:{title:'Trend',showgrid:true,gridcolor:'#21262d',zeroline:true,zerolinecolor:'#333',

    legend:{bgcolor:'#161b22',bordercolor:'#30363d',borderwidth:1,orientation:'h',x:0,y:1.01,xanchor:'left'},
    hovermode:'x unified',hoverlabel:{bgcolor:'#21262d',bordercolor:'#30363d',font:{family:'monospace',size:11}},
    margin:{t:8,b:55,l:65,r:10},height:640,shapes};}
function switchStock(sym){
  document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active',b.dataset.sym===sym));
  const d=ALL[sym]; renderSummary(d);
  Plotly.react('chart',buildTraces(d),buildLayout(d),{responsive:true,scrollZoom:true,displaylogo:false});}

  const b=document.createElement('button');
  b.className='btn';b.dataset.sym=sym;b.textContent=sym;
  b.title=`P&L: ${ALL[sym].pnl>=0?'+':''}Rs${ALL[sym].pnl} | Flips: ${ALL[sym].flips}`;
  b.onclick=()=>switchStock(sym);btns.appendChild(b);});
